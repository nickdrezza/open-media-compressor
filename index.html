<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Private, browser-based compression for photos and videos. Compression runs locally on your device.">
    <meta name="keywords"
        content="media compressor, video compressor, image compressor, gif compressor, private compression, ffmpeg.wasm, brutalist ui">
    <meta name="author" content="guidrezza">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Compressor" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles.css">
    <title>Open Media Compressor | Private Browser-Based Compression</title>
</head>

<body x-data="compressor()" @dragover.window.prevent="isDragging = true"
    @dragleave.window.prevent="isDragging = false" @drop.window.prevent="handleDrop($event)">

    <header>
        <h1>Open Media Compressor</h1>
    </header>

    <main id="main-content" :aria-busy="isCompressing">
        <div id="drop-zone" :class="{ 'dragover': isDragging, 'hidden': files.length > 0 }" role="region" aria-label="Upload files"
            @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false"
            @drop.prevent.stop="handleDrop($event)">
            <svg id="upload-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
            </svg>
            <div id="upload-text">DROP IN FILES OR UPLOAD</div>
            <button id="upload-btn" type="button" @click="$refs.fileInput.click()">Choose files</button>
        </div>
        <input id="file-input" type="file" x-ref="fileInput" multiple class="visually-hidden"
            aria-label="Upload media" @change="handleFiles($event)">

        <div id="file-list-container" x-show="files.length > 0" style="display: none;">
            <div id="file-list">
                <template x-for="(file, index) in files" :key="index">
                    <div class="file-item" :class="file.status">
                        <div class="file-info">
                            <span class="file-name" :title="file.raw.name" x-text="file.raw.name"></span>
                            <span class="file-size" x-text="formatSize(file.raw.size)"></span>
                        </div>
                        <div class="file-status-row">
                            <span class="file-status-label" x-show="file.status"
                                x-text="file.status?.toUpperCase()"></span>
                            <span class="file-status-msg" role="status" aria-live="polite" x-show="file.statusMessage"
                                x-text="file.statusMessage"></span>
                            <progress class="file-progress" max="100" x-show="file.status === 'processing'"
                                :value="file.progress" :aria-label="`Compressing ${file.raw.name}`"></progress>
                        </div>
                    </div>
                </template>

                <button class="file-item upload-more-item" type="button" @click="$refs.fileInput.click()">
                    <span class="file-name">Upload more 🔼</span>
                    <span class="file-size"></span>
                </button>
            </div>
        </div>

        <p id="phase-status" role="status" aria-live="polite" x-text="phaseMessage"></p>
    </main>

    <div id="controls-area">
        <div class="control-row">
            <div class="size-control">
                <label for="max-size">Max Size:</label>
                <input id="max-size" type="number" min="0" step="any" x-model="maxSize"
                    :disabled="isCompressing" :aria-invalid="validationError ? 'true' : 'false'"
                    aria-describedby="target-validation-error">
                <div class="toggle-group" aria-label="Target size unit">
                    <button class="toggle-btn" type="button" :class="{ 'active': unit === 'KB' }"
                        :aria-pressed="unit === 'KB'" :disabled="isCompressing" @click="unit = 'KB'">KB</button>
                    <button class="toggle-btn" type="button" :class="{ 'active': unit === 'MB' }"
                        :aria-pressed="unit === 'MB'" :disabled="isCompressing" @click="unit = 'MB'">MB</button>
                </div>
            </div>
            <p id="target-validation-error" class="validation-error" role="alert" x-show="validationError"
                x-text="validationError"></p>
        </div>
        <div class="control-row">
            <button id="compress-btn" type="button" @click="startCompression"
                :disabled="isCompressing || files.length === 0"
                x-text="isCompressing ? 'WORKING...' : 'COMPRESS'">
                COMPRESS
            </button>
        </div>
    </div>

    <footer>
        <div class="footer-line">
            Open-source and free to use. Compression runs in your browser on your device; this app does not upload your files.
        </div>
        <div class="footer-line">
            Made by <a href="https://nickdrezza.com" target="_blank" rel="noreferrer">nickdrezza</a>
        </div>
    </footer>

    <script type="module" src="/src/app.js"></script>
</body>

</html>
